# 문장 조각 원본. 기획자·작가가 직접 큐레이션한다 (AI 생성 문구 아님 — 이 파일은
# 초기 스캐폴딩 목적의 샘플이며, 실제 서비스 문장은 작가가 교체·검수한다).
# id: 고유 식별자 (s + 2자리)
# text: 조각으로 노출될 한 문장
# tags: 자유 태그. 임베딩과 별개로 사람이 훑어볼 때 참고용

- id: s01
  text: 그날 이후로 그는 우산을 펼 때마다 손끝이 떨렸다.
  tags: [상실, 습관, 트라우마]
- id: s02
  text: 편지는 부치지 못한 채 서랍 안에서 십 년을 묵었다.
  tags: [미련, 시간, 편지]
- id: s03
  text: 막차를 놓친 사람들은 서로의 얼굴을 오래 쳐다보지 않았다.
  tags: [도시, 밤, 익명성]
- id: s04
  text: 할머니는 죽은 이의 이름을 부를 때만 사투리를 썼다.
  tags: [가족, 방언, 죽음]
- id: s05
  text: 냉장고 문을 열 때마다 그 집 냄새가 훅 끼쳤다.
  tags: [기억, 감각, 집]
- id: s06
  text: 아이는 그림자를 밟지 않으려 온종일 까치발로 걸었다.
  tags: [유년, 미신, 놀이]
- id: s07
  text: 바다는 항구에서 보는 것과 배 위에서 보는 것이 전혀 다른 짐승이었다.
  tags: [바다, 시점, 두려움]
- id: s08
  text: 그녀는 이혼 서류에 서명하며 자신의 필체가 낯설다고 생각했다.
  tags: [이별, 정체성, 서류]
- id: s09
  text: 정전이 된 밤, 온 가족이 촛불 하나를 가운데 두고 둘러앉았다.
  tags: [가족, 정전, 온기]
- id: s10
  text: 그는 매일 같은 벤치에 앉아 다른 사람인 척 신문을 읽었다.
  tags: [고독, 위장, 반복]
- id: s11
  text: 마지막 문장을 쓰지 못한 소설이 세 편째였다.
  tags: [창작, 실패, 미완]
- id: s12
  text: 폐업한 가게의 간판은 오 년째 그대로 걸려 있었다.
  tags: [상실, 시간, 흔적]
- id: s13
  text: 강아지는 주인이 죽은 자리를 매일 같은 시간에 찾아갔다.
  tags: [동물, 애도, 습관]
- id: s14
  text: 그는 거짓말을 할 때만 상대의 눈을 똑바로 보았다.
  tags: [거짓, 습관, 관계]
- id: s15
  text: 첫눈이 내리던 날, 우체통에 답장 없는 편지가 쌓여갔다.
  tags: [계절, 기다림, 편지]
- id: s16
  text: 낡은 피아노는 건반 두 개가 소리를 내지 않았지만 아무도 고치지 않았다.
  tags: [악기, 결핍, 방치]
- id: s17
  text: 그녀는 이사할 때마다 화분 하나만은 절대 버리지 않았다.
  tags: [식물, 애착, 이사]
- id: s18
  text: 지하철 막차 안에서 낯선 사람이 그의 어깨에 기대 잠들었다.
  tags: [도시, 우연, 온기]
- id: s19
  text: 아버지는 퇴직 후 매일 정장을 입고 공원 벤치로 출근했다.
  tags: [노년, 정체성, 습관]
- id: s20
  text: 그 섬에서는 태풍이 지나간 다음 날에만 시장이 열렸다.
  tags: [섬, 재난, 공동체]
- id: s21
  text: 그는 유서를 세 번 고쳐 쓰고 결국 아무에게도 보내지 않았다.
  tags: [죽음, 망설임, 미완]
- id: s22
  text: 오래된 카세트테이프에서 지지직거리는 소리 사이로 어머니의 웃음이 섞여 있었다.
  tags: [기억, 소리, 그리움]
- id: s23
  text: 소년은 전학 첫날 자신의 이름을 세 번이나 다르게 말했다.
  tags: [정체성, 유년, 불안]
- id: s24
  text: 폭우가 쏟아지던 밤, 두 사람은 처마 밑에서 말없이 담배를 나눠 피웠다.
  tags: [우연, 침묵, 관계]
- id: s25
  text: 그녀의 마지막 일기는 날씨 이야기로 끝나 있었다.
  tags: [일기, 죽음, 사소함]
- id: s26
  text: 폐가가 된 옛집 마당에는 여전히 봉숭아가 피었다.
  tags: [집, 자연, 지속]
- id: s27
  text: 그는 이름 모를 역에서 내려 두 시간을 걸었다.
  tags: [여행, 우연, 방황]
- id: s28
  text: 형제는 유산 문제로 등을 돌린 뒤에도 같은 산소에 성묘를 갔다.
  tags: [가족, 갈등, 의례]
- id: s29
  text: 낡은 사진 속 자신이 웃고 있는 이유를 그는 끝내 기억해내지 못했다.
  tags: [사진, 기억, 상실]
- id: s30
  text: 여관방 벽지에는 전 투숙객이 남긴 낙서가 빼곡했다.
  tags: [익명, 흔적, 여행]
- id: s31
  text: 그녀는 매일 아침 죽은 남편의 몫까지 두 잔의 커피를 내렸다.
  tags: [애도, 습관, 사랑]
- id: s32
  text: 공장이 문을 닫던 날, 노동자들은 마지막으로 기계에 손을 얹어 보았다.
  tags: [노동, 이별, 산업]
- id: s33
  text: 태어난 지 한 달 된 조카는 낯선 손길에도 울지 않고 빤히 쳐다보았다.
  tags: [탄생, 신뢰, 관찰]
- id: s34
  text: 오래 떠나 있던 고향에 돌아오니 골목의 폭이 낯설게 좁아 보였다.
  tags: [귀향, 기억, 왜곡]
- id: s35
  text: 그는 매번 같은 꿈에서 깨어나기 직전 문의 손잡이를 놓쳤다.
  tags: [꿈, 반복, 불안]
- id: s36
  text: 별거 중인 부부는 여전히 같은 식탁에서 각자의 밥그릇을 놓고 먹었다.
  tags: [관계, 침묵, 습관]
- id: s37
  text: 화재로 무너진 도서관에서 유일하게 남은 것은 대출카드 상자였다.
  tags: [재난, 기록, 우연]
- id: s38
  text: 시골 정류장의 시간표는 이미 없어진 버스 시간까지 그대로 적혀 있었다.
  tags: [시골, 시간, 흔적]
- id: s39
  text: 노인은 손주의 이름 대신 죽은 아들의 이름을 자꾸 불렀다.
  tags: [노년, 기억, 혼동]
- id: s40
  text: 폭설이 내린 다음 날 아침, 발자국 하나가 마당을 가로질러 사라져 있었다.
  tags: [자연, 미스터리, 흔적]

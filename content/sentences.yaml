- id: s149
  text: "나는 1632년 영국 요크 시에서 태어났다."
  tags: ["대니얼 디포", "로빈슨 크루소"]
- id: s150
  text: "내가 잉태되던 순간을 생각하면 아쉽다."
  tags: ["로렌스 스턴", "트리스트럼 섄디"]
- id: s151
  text: "훌쩍 떠나온 것이 나는 얼마나 기쁜지!"
  tags: ["요한 볼프강 폰 괴테", "젊은 베르테르의 슬픔"]
- id: s152
  text: "아픔을 겪은 후 난 슬프고 우울했다."
  tags: ["얀 마텔", "파이 이야기"]
- id: s153
  text: "그 대본은 이틀 만에 몰아쳐 써낸 것이다."
  tags: ["이언 매큐언", "속죄"]
- id: s154
  text: "피닉스 기온은 섭씨 24도였다."
  tags: ["스테프니 메이어", "트와일라잇"]
- id: s155
  text: "이게 소설의 첫 문장이다."
  tags: ["브래들리 본드", "닌자 슬레이어"]
- id: s156
  text: "나는 별 느낌 없이 고등학생이 되었다."
  tags: ["타니가와 나가루", "스즈미야 하루히의 우울"]
- id: s157
  text: "서커스는 예고 없이 찾아온다."
  tags: ["에린 모겐스턴", "나이트 서커스"]
- id: s158
  text: "3월 말 어느 날 밤, 한 십대가 총을 들었다."
  tags: ["프레드릭 배크만", "베어타운"]
- id: s159
  text: "역사는 우리를 저버렸지만, 그래도 상관없다."
  tags: ["이민진", "파친코"]
- id: s160
  text: "돼지에게 인권을 주지 않는 나라는 없다."
  tags: ["아사토 아사토", "86 에이티식스"]
- id: s161
  text: "세종대왕 즉위 십오 년, 한 재상이 있었다."
  tags: ["허균", "홍길동전"]
- id: s162
  text: "허생은 묵적골에 살고 있었다."
  tags: ["박지원", "허생전"]
- id: s163
  text: "일청전쟁의 총소리가 평양을 뒤흔들었다."
  tags: ["이인직", "혈의 누"]
- id: s164
  text: "겨울 저녁, 푸른 하늘이 새로이 짙어졌다."
  tags: ["이인직", "은세계"]
- id: s165
  text: "리형식은 수업을 마치고 김 장로 집으로 간다."
  tags: ["이광수", "무정"]
- id: s166
  text: "눈은 아니 오고 비가 추적추적 내리었다."
  tags: ["현진건", "운수 좋은 날"]
- id: s167
  text: "나는 금년 여섯 살 난 처녀애입니다."
  tags: ["주요섭", "사랑 손님과 어머니"]
- id: s168
  text: "바다는 크레파스보다 진한 비늘로 숨을 쉰다."
  tags: ["최인훈", "광장"]
- id: s169
  text: "무진 10km라는 이정비를 보았다."
  tags: ["김승옥", "무진기행"]
- id: s170
  text: "그믐달이 동녘 하늘에 비스듬히 걸려 있었다."
  tags: ["조정래", "태백산맥"]
- id: s171
  text: "초록빛 가득한 들녘 끝은 아슴하게 멀었다."
  tags: ["조정래", "아리랑"]
- id: s172
  text: "새벽 어스름이 스러지는 겨울 들판을 기차가 달린다."
  tags: ["조정래", "한강"]
- id: s173
  text: "크아아아아! 투명드래곤이 울부짖었다."
  tags: ["뒤치닥", "투명드래곤"]
- id: s174
  text: "이 냉장고의 전생은 훌리건이었을 것이다."
  tags: ["박민규", "카스테라"]
- id: s175
  text: "서울을 버려야 서울로 돌아올 수 있다."
  tags: ["김훈", "남한산성"]
- id: s176
  text: "엄마를 잃어버린 지 일주일째다."
  tags: ["신경숙", "엄마를 부탁해"]
- id: s177
  text: "내일을 준비하던 천지가, 오늘 죽었다."
  tags: ["김려령", "우아한 거짓말"]
- id: s178
  text: "나는 내 아버지의 사형 집행인이었다."
  tags: ["정유정", "7년의 밤"]
- id: s179
  text: "비가 올 것 같아."
  tags: ["한강", "소년이 온다"]
- id: s180
  text: "불광천에는 오리가 산다. 나는 돈이 없다."
  tags: ["김근우", "고양이를 잡아먹은 오리"]
- id: s181
  text: "사랑하는 사람은 사랑의 숙주이다."
  tags: ["이승우", "사랑의 생애"]
- id: s182
  text: "높디높은 밤하늘에 있지 않더라도."
  tags: ["Q10", "별을 품은 소드마스터"]
